name: Native Windows Build

on:
  push:
    branches:
      - cpp-native-rewrite
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x64
        run: cmake -S native -B build/native -A x64

      - name: Build Release
        run: cmake --build build/native --config Release
